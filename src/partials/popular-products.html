<section class="popular-products" id="popular-products">
  <div class="container popular-products__container">
   <h2 class="popular-products__title">
  Наші<br />
  бестселлери
</h2> 

    <div class="popular-products__viewport" data-popular-viewport>
      <ul class="popular-products__list" data-popular-list></ul>
    </div>

    <div class="popular-products__controls">
      <ul class="popular-products__pagination" data-popular-pagination></ul>

      <div class="popular-products__buttons">
        <button
          class="popular-products__btn"
          type="button"
          data-popular-prev
          aria-label="Попередній товар"
        >
        <svg class="about-nav-icon" width="24" height="24">
             <use href="./img/icons.svg#icon-arrow-back"></use>
        </svg>
        </button>

        <button
          class="popular-products__btn"
          type="button"
          data-popular-next
          aria-label="Наступний товар"
        >
        <svg class="about-nav-icon" width="24" height="24">
            <use href="./img/icons.svg#icon-arrow-forward"></use>
        </svg>
        </button>
      </div>
    </div>
  </div>
</section>
