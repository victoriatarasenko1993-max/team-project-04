<section class="feedback-section" id="feedback">
  <div class="container feedback-container">
    <h2 class="feedback-title">Відгуки клієнтів</h2>
    <p class="feedback-text">Найкращі десерти, які я коли-небудь куштував!</p>

    <div class="feedback-slider-wrap">
      <button
        class="feedback-nav feedback-nav-prev"
        type="button"
        aria-label="Попередній відгук"
        hidden
      >
        <svg class="feedback-nav-icon" width="24" height="24">
          <use href="./img/icons.svg#icon-arrow-back"></use>
        </svg>
      </button>

      <div class="swiper feedback-swiper">
        <ul class="swiper-wrapper feedback-list" hidden></ul>
      </div>

      <button
        class="feedback-nav feedback-nav-next"
        type="button"
        aria-label="Наступний відгук"
        hidden
      >
        <svg class="feedback-nav-icon" width="24" height="24">
          <use href="./img/icons.svg#icon-arrow-forward"></use>
        </svg>
      </button>
    </div>

    <div class="feedback-bottom" hidden>
      <div class="feedback-pagination"></div>
    </div>

    <div class="feedback-loader-wrap">
      <div role="status" aria-label="Завантаження відгуків"></div>
    </div>
  </div>
</section>
